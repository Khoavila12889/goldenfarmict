# OnlyOffice Document Server - Nginx Configuration with CORS
# This config adds CORS headers to allow browser access from any origin

map $http_host $this_host {
    "" $host;
    default $http_host;
}

map $http_x_forwarded_proto $the_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $the_host {
    default $http_x_forwarded_host;
    "" $this_host;
}

map $http_upgrade $proxy_connection {
    default upgrade;
    "" close;
}

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $proxy_connection;
proxy_set_header X-Forwarded-Host $the_host;
proxy_set_header X-Forwarded-Proto $the_scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # CORS Headers - Allow all origins
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Handle preflight OPTIONS requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Healthcheck endpoint
    location /healthcheck {
        proxy_pass http://localhost:8000/healthcheck;
    }

    # Web apps
    location /web-apps {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
    }

    # Cache
    location /cache-doc {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
    }

    # Coauthoring
    location /coauthoring {
        proxy_pass http://localhost:8000/coauthoring;
        proxy_http_version 1.1;
    }

    # Converter
    location /ConvertService.ashx {
        proxy_pass http://localhost:8000/ConvertService.ashx;
        proxy_http_version 1.1;
    }

    # File upload
    location /FileUploader.ashx {
        proxy_pass http://localhost:8000/FileUploader.ashx;
        proxy_http_version 1.1;
    }

    # Default location
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
    }
}
