<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test OnlyOffice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .pending { background: #fff3cd; color: #856404; }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        #viewer { width: 100%; height: 600px; border: 1px solid #ccc; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🧪 OnlyOffice Integration Test</h1>
    
    <div class="test-section">
        <h2>Test 1: OnlyOffice Server Healthcheck</h2>
        <button onclick="testHealthcheck()">Test Healthcheck</button>
        <div id="healthcheck-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Load OnlyOffice API Script</h2>
        <button onclick="testLoadScript()">Load API Script</button>
        <div id="script-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Get Document Config</h2>
        <button onclick="testGetConfig()">Get Config</button>
        <div id="config-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 4: Initialize OnlyOffice Editor</h2>
        <button onclick="testInitEditor()">Init Editor</button>
        <div id="viewer"></div>
        <div id="editor-result"></div>
    </div>

    <script>
        const ONLYOFFICE_URL = 'http://10.0.0.9:8080';
        const BACKEND_URL = 'http://10.0.0.9:8088/api';
        
        let editorConfig = null;

        async function testHealthcheck() {
            const resultDiv = document.getElementById('healthcheck-result');
            resultDiv.innerHTML = '<div class="test-result pending">Testing...</div>';
            
            try {
                const response = await fetch(`${ONLYOFFICE_URL}/healthcheck`);
                const text = await response.text();
                
                if (response.ok && text === 'true') {
                    resultDiv.innerHTML = `<div class="test-result success">✅ Healthcheck passed: ${text}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="test-result error">❌ Healthcheck failed: ${response.status} - ${text}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="test-result error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testLoadScript() {
            const resultDiv = document.getElementById('script-result');
            resultDiv.innerHTML = '<div class="test-result pending">Loading script...</div>';
            
            const scriptUrl = `${ONLYOFFICE_URL}/web-apps/apps/api/documents/api.js`;
            
            // Remove old script if exists
            const oldScript = document.getElementById('oo-script');
            if (oldScript) oldScript.remove();
            
            const script = document.createElement('script');
            script.id = 'oo-script';
            script.src = scriptUrl;
            
            script.onload = () => {
                if (window.DocsAPI) {
                    resultDiv.innerHTML = `<div class="test-result success">✅ Script loaded successfully! DocsAPI version: ${window.DocsAPI.version || 'unknown'}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="test-result error">❌ Script loaded but DocsAPI not found</div>`;
                }
            };
            
            script.onerror = () => {
                resultDiv.innerHTML = `<div class="test-result error">❌ Failed to load script from: ${scriptUrl}</div>`;
            };
            
            document.head.appendChild(script);
        }

        async function testGetConfig() {
            const resultDiv = document.getElementById('config-result');
            resultDiv.innerHTML = '<div class="test-result pending">Fetching config...</div>';
            
            try {
                const url = `${BACKEND_URL}/documents/onlyoffice/config?config_id=27&file_path=/test.docx&user_code=admin&user_role=admin`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (response.ok) {
                    editorConfig = data;
                    resultDiv.innerHTML = `
                        <div class="test-result success">✅ Config received</div>
                        <pre style="background:#f5f5f5;padding:10px;overflow:auto;max-height:200px;">${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="test-result error">❌ Failed: ${response.status} - ${JSON.stringify(data)}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="test-result error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testInitEditor() {
            const resultDiv = document.getElementById('editor-result');
            
            if (!window.DocsAPI) {
                resultDiv.innerHTML = '<div class="test-result error">❌ DocsAPI not loaded. Run Test 2 first.</div>';
                return;
            }
            
            if (!editorConfig) {
                resultDiv.innerHTML = '<div class="test-result error">❌ Config not loaded. Run Test 3 first.</div>';
                return;
            }
            
            resultDiv.innerHTML = '<div class="test-result pending">Initializing editor...</div>';
            
            try {
                const viewerDiv = document.getElementById('viewer');
                viewerDiv.innerHTML = ''; // Clear previous editor
                
                const editor = new window.DocsAPI.DocEditor('viewer', editorConfig);
                
                resultDiv.innerHTML = '<div class="test-result success">✅ Editor initialized! Check above.</div>';
            } catch (error) {
                resultDiv.innerHTML = `<div class="test-result error">❌ Error: ${error.message}</div>`;
                console.error('Editor init error:', error);
            }
        }

        // Auto-run healthcheck on page load
        window.addEventListener('load', () => {
            console.log('Test page loaded. Run tests manually or check console for errors.');
        });
    </script>
</body>
</html>
