# ─── OnlyOffice reverse-proxy maps ──────────────────────────────────────────
# OnlyOffice Document Server builds absolute redirect URLs from
#   $the_scheme://$the_host$the_prefix/...
# (see /etc/nginx/includes/http-common.conf inside the DS container).
# `$host` in nginx strips the port, so forwarding it makes DS emit
# "http://localhost/9.4.0-.../..." and the browser then hits port 80 → the
# editor iframe never loads (blank page). `$http_host` keeps the port, and
# X-Forwarded-Host/-Proto let an upstream proxy (NPM, Cloudflare) override it.
map $http_x_forwarded_host $oo_host {
    ~^([^,]+)  $1;
    default    $http_x_forwarded_host;
    ""         $http_host;
}

map $http_x_forwarded_proto $oo_scheme {
    ~^([^,]+)  $1;
    default    $http_x_forwarded_proto;
    ""         $scheme;
}

map $http_upgrade $oo_connection {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver — needed for variable-based proxy_pass
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Main route - serve React app (fix 404 on refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE endpoint — separate location with long timeout
    location = /api/events {
        # Use variable to force nginx to resolve DNS on each request (avoids stale IP after restart)
        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # SSE requires no buffering and long read timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        access_log /var/log/nginx/api-access.log;
        error_log /var/log/nginx/api-error.log;
    }

    # WebSocket endpoint — long timeout
    location = /api/chat/ws {
        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_buffering off;
        proxy_cache off;

        access_log /var/log/nginx/api-access.log;
        error_log /var/log/nginx/api-error.log;
    }

    # API proxy - forward to backend (normal requests)
    location /api/ {
        # Use variable to force nginx to resolve DNS on each request (avoids stale IP after restart)
        set $backend http://backend:8000;
        proxy_pass $backend;

        proxy_http_version 1.1;

        # Set headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # WebSocket support (only when client sends Upgrade header)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;

        # Log
        access_log /var/log/nginx/api-access.log;
        error_log /var/log/nginx/api-error.log;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # OnlyOffice Document Server proxy — DocsAPI JS + editor resources
    location /onlyoffice/ {
        proxy_pass http://onlyoffice:80/;
        proxy_http_version 1.1;

        # Keep the browser's port in Host so DS builds correct absolute redirects
        proxy_set_header Host $oo_host;
        proxy_set_header X-Forwarded-Host $oo_host;
        proxy_set_header X-Forwarded-Proto $oo_scheme;
        # DS natively supports being mounted under a path prefix: it inserts
        # $the_prefix into every redirect/websocket/cache URL it generates.
        proxy_set_header X-Forwarded-Prefix /onlyoffice;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oo_connection;

        # No proxy_redirect needed: with X-Forwarded-Prefix + Host carrying the
        # port, DS already emits "/onlyoffice/9.4.0-<tag>/web-apps/..." correctly.

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
    }

    # OnlyOffice cached/converted files — SDK generates /cache/files/... URLs
    location /cache/ {
        proxy_pass http://onlyoffice:80/cache/;
        proxy_http_version 1.1;

        proxy_set_header Host $oo_host;
        proxy_set_header X-Forwarded-Host $oo_host;
        proxy_set_header X-Forwarded-Proto $oo_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Do NOT buffer — secure_link needs streaming
        proxy_buffering off;
    }

    # OnlyOffice cached/converted files — also handle /onlyoffice/cache/ path
    location /onlyoffice/cache/ {
        proxy_pass http://onlyoffice:80/cache/;
        proxy_http_version 1.1;

        proxy_set_header Host $oo_host;
        proxy_set_header X-Forwarded-Host $oo_host;
        proxy_set_header X-Forwarded-Proto $oo_scheme;
        proxy_set_header X-Forwarded-Prefix /onlyoffice;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
    }

    # OnlyOffice versioned URLs — DS redirects /web-apps/... to /9.4.0-xxx/web-apps/...
    # Editor resources (CSS, JS, fonts) inside the iframe load from versioned paths.
    location ~ ^/[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]+/ {
        proxy_pass http://onlyoffice:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
    }

    # Draw.io (Diagrams.net) proxy — iframe editor qua cùng domain
    location /drawio/ {
        proxy_pass http://drawio:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
    }
}
