version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: goldenfarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - goldenfarm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldenfarm -d goldenfarmict"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64  
    container_name: goldenfarm-backend
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Backend code for hot-reload
      - ./backend/app:/app/app:rw
      - ./backend/main.py:/app/main.py:rw
      # Mount logs directory
      - ./backend/logs:/app/logs:rw
      - ./backend/uploads:/app/uploads:rw
      # Mount luong.docx template (read-only)
      - ./frontend/src/template:/app/templates:ro
    environment:
      - APP_ENV=${APP_ENV}
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL}
      - ONLYOFFICE_URL=${ONLYOFFICE_URL}
      - ONLYOFFICE_PUBLIC_URL=${ONLYOFFICE_PUBLIC_URL}
      - ONLYOFFICE_SECRET=${ONLYOFFICE_SECRET}
      - ONLYOFFICE_ENABLED=${ONLYOFFICE_ENABLED}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - goldenfarm-network

  # 3. Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goldenfarm-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - goldenfarm-network

  # 4. OnlyOffice Document Server (for viewing/editing Office files)
  # OnlyOffice Document Server cho phép xem/chỉnh sửa file Office trực tiếp trong browser
  # Yêu cầu: Tối thiểu 4GB RAM
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: goldenfarm-onlyoffice
    ports:
      - "${ONLYOFFICE_PORT}:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_SECRET}
      - JWT_HEADER=AuthorizationJwt
      - JWT_IN_BODY=true
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
    restart: unless-stopped
    networks:
      - goldenfarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  goldenfarm-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  onlyoffice-data:
    driver: local
  onlyoffice-logs:
    driver: local