services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: goldenfarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - goldenfarm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64  
    container_name: goldenfarm-backend
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:rw
      - ./backend/main.py:/app/main.py:rw
      - ./backend/logs:/app/logs:rw
      - ./backend/uploads:/app/uploads:rw
      - ./backend/storage:/app/storage:rw
      - ./frontend/src/template:/app/templates:ro
    environment:
      - APP_ENV=${APP_ENV}
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CORS_ORIGINS=${CORS_ORIGINS}
      # URL mà OnlyOffice Document Server dùng để tải file + gửi callback.
      # BẮT BUỘC phải là địa chỉ DS resolve được (DNS nội bộ Docker).
      # Nếu để backend tự suy ra từ header Host của browser, DS sẽ gọi ngược
      # về frontend và báo "connect ECONNREFUSED" trong docservice/out.log.
      - BACKEND_PUBLIC_URL=${ONLYOFFICE_BACKEND_URL:-http://backend:8000}
      - ONLYOFFICE_URL=${ONLYOFFICE_URL}
      - ONLYOFFICE_PUBLIC_URL=${ONLYOFFICE_PUBLIC_URL}
      - ONLYOFFICE_SECRET=${ONLYOFFICE_SECRET}
      - SESSION_SECRET=${SESSION_SECRET:-${ONLYOFFICE_SECRET}}
      - ONLYOFFICE_ENABLED=${ONLYOFFICE_ENABLED}
      - DRAWIO_PUBLIC_URL=${DRAWIO_PUBLIC_URL}
      - FORMULA_PRINT_AGENT_KEY=${FORMULA_PRINT_AGENT_KEY:-}
      - FORMULA_PRINT_DPI=${FORMULA_PRINT_DPI:-300}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - goldenfarm-network

  # 3. Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goldenfarm-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - goldenfarm-network

  # 4. Draw.io (Diagrams.net)
  drawio:
    # 31.4.4 fixes PDF export without an export server (browser Print -> Save as PDF).
    # Pin the tested image: latest previously left this deployment on 31.4.2.
    image: jgraph/drawio:31.4.4@sha256:7b0cd0d943b6b46825ce42bc0f406e26b1f5155bf71892fc2095069c73a817d5
    container_name: goldenfarm-drawio
    ports:
      - "${DRAWIO_PORT}:8080"
    environment:
      - DRAWIO_ENABLE_PLUGINS=false
    restart: unless-stopped
    networks:
      - goldenfarm-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 5. OnlyOffice Document Server
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: goldenfarm-onlyoffice
    ports:
      - "${ONLYOFFICE_PORT}:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_SECRET}
      - JWT_IN_BODY=true
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
    restart: unless-stopped
    networks:
      - goldenfarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 6. ArtCraft web demos (Word/Grid/Pdf) — OPTIONAL, branch wordcraft-viewer.
  # Không chạy mặc định. Chạy khi cần demo ở /craft-demo:
  #   docker compose --profile craft up -d wordcraft-web gridcraft-web pdfcraft-web
  # Mỗi service serve 1 thư mục tĩnh ./craft-web/<app> (trunk build --release hoặc
  # giải nén release *-web-*.zip vào đó). Chưa có dist thì trang placeholder
  # trong thư mục sẽ hướng dẫn.
  wordcraft-web:
    image: nginx:alpine
    container_name: goldenfarm-wordcraft-web
    profiles: ["craft"]
    ports:
      - "8771:80"
    volumes:
      - ./craft-web/wordcraft:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - goldenfarm-network

  gridcraft-web:
    image: nginx:alpine
    container_name: goldenfarm-gridcraft-web
    profiles: ["craft"]
    ports:
      - "8772:80"
    volumes:
      - ./craft-web/gridcraft:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - goldenfarm-network

  pdfcraft-web:
    image: nginx:alpine
    container_name: goldenfarm-pdfcraft-web
    profiles: ["craft"]
    ports:
      - "8773:80"
    volumes:
      - ./craft-web/pdfcraft:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - goldenfarm-network

networks:
  goldenfarm-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  onlyoffice-data:
    driver: local
  onlyoffice-logs:
    driver: local
