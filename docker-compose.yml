version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: goldenfarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: goldenfarm
      POSTGRES_PASSWORD: your_strong_password
      POSTGRES_DB: goldenfarmict
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - goldenfarm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldenfarm -d goldenfarmict"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64  
    container_name: goldenfarm-backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Backend code for hot-reload
      - ./backend/app:/app/app:rw
      - ./backend/main.py:/app/main.py:rw
      # Giữ lại mount SQLite directory để chạy script migrate dữ liệu
      - ./backend/data:/app/data:rw
      # Mount logs directory
      - ./backend/logs:/app/logs:rw
      # Mount luong.docx template (read-only)
      - ./frontend/src/template:/app/templates:ro
    environment:
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
      # Chuỗi kết nối đến container Postgres (tên host là 'db')
      - DATABASE_URL=postgresql://goldenfarm:your_strong_password@db:5432/goldenfarmict
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088
      # OnlyOffice Document Server configuration
      # BACKEND_PUBLIC_URL: URL để OnlyOffice Document Server gọi callback tải file (Docker internal network)
      - BACKEND_PUBLIC_URL=http://backend:8000
      # ONLYOFFICE_URL: Backend kết nối tới OnlyOffice Document Server (Docker internal network)
      - ONLYOFFICE_URL=http://onlyoffice:80
      # ONLYOFFICE_PUBLIC_URL: Trình duyệt tải OnlyOffice API JS (phải truy cập được từ browser)
      # Nếu dùng Docker trên máy chủ, thay 10.0.0.9 bằng IP thật của máy chủ hoặc domain
      - ONLYOFFICE_PUBLIC_URL=http://10.0.0.9:8080
      - ONLYOFFICE_SECRET=MySuperSecret123456
      - ONLYOFFICE_ENABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - goldenfarm-network

  # 3. Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goldenfarm-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - goldenfarm-network

  # 4. OnlyOffice Document Server (for viewing/editing Office files)
  # OnlyOffice Document Server cho phép xem/chỉnh sửa file Office trực tiếp trong browser
  # Yêu cầu: Tối thiểu 4GB RAM
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: goldenfarm-onlyoffice
    ports:
      - "8080:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=MySuperSecret123456
      - JWT_HEADER=AuthorizationJwt
      - JWT_IN_BODY=true
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
    restart: unless-stopped
    networks:
      - goldenfarm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  goldenfarm-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  onlyoffice-data:
    driver: local
  onlyoffice-logs:
    driver: local